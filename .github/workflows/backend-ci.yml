name: Backend CI

"on":
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret-key-not-for-production
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov pip-audit
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Mypy type check
        working-directory: backend
        run: mypy app/core app/main.py --ignore-missing-imports --explicit-package-bases
      - name: Pytest with coverage
        working-directory: backend
        run: pytest --cov=app.core --cov-report=term-missing --cov-fail-under=80
      - name: Dependency vulnerability scan
        working-directory: backend
        run: pip-audit -r requirements.txt
